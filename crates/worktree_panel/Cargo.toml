[package]
name = "worktree_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/worktree_panel.rs"
doctest = false

[dependencies]
db.workspace = true
anyhow.workspace = true
# The agents running in this worktree's terminals.
agent_tracker.workspace = true
git.workspace = true
# The one place the colour of a pull request's state is decided.
git_ui_core.workspace = true
# Asking the GitHub CLI what pull requests a branch has.
github_cli.workspace = true
gpui.workspace = true
log.workspace = true
menu.workspace = true
project.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
theme.workspace = true
ui.workspace = true
# The single-line input the new-worktree modal asks for a name with.
ui_input.workspace = true
util.workspace = true
# Finding git, to ask it about projects the window has no repository for.
which.workspace = true
workspace.workspace = true
zed_actions.workspace = true

[dev-dependencies]
# The filter box needs the erased editor the application registers at startup.
editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
# Not used here: `git_ui_core` reaches `remote_connection`, whose own code only
# handles the mock connection its test-support feature adds, and the dev
# dependencies below turn that feature on across the build.
remote_connection = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
